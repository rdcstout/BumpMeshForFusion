name: Build installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s tests -v
      - run: node --test tests/test_fusion_bridge.cjs
  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS installer
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          chmod +x packaging/macos/build-pkg.sh packaging/macos/scripts/postinstall
          packaging/macos/build-pkg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: BumpMeshForFusion-macOS
          path: dist/BumpMeshForFusion-macOS.pkg

  manual:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manual installation archive
        run: |
          chmod +x packaging/build-manual-zip.sh
          packaging/build-manual-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BumpMeshForFusion-Manual
          path: dist/BumpMeshForFusion-Manual.zip

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: powershell
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version -and $env:GITHUB_REF_TYPE -eq 'tag') { $version = "${env:GITHUB_REF_NAME}".TrimStart("v") }
          .\packaging\windows\build-installer.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: BumpMeshForFusion-Windows
          path: dist/BumpMeshForFusion-Windows-Setup.exe
